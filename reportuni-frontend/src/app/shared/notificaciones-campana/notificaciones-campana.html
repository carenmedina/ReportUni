<div class="ru-campana">
  <button
    type="button"
    class="ru-campana__boton"
    (click)="alternar()"
    [attr.aria-expanded]="abierto()"
    aria-label="Notificaciones"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
    @if (noLeidas() > 0) {
      <span class="ru-campana__contador">{{ noLeidas() > 9 ? '9+' : noLeidas() }}</span>
    }
  </button>

  @if (abierto()) {
    <div class="ru-campana__panel" role="dialog" aria-label="Notificaciones">
      <div class="ru-campana__cabecera">
        <strong>Notificaciones</strong>
        @if (noLeidas() > 0) {
          <button type="button" class="ru-campana__enlace" (click)="marcarTodas()">Marcar todas como leídas</button>
        }
      </div>

      @if (cargando()) {
        <p class="ru-campana__vacio">Cargando...</p>
      } @else if (error()) {
        <p class="ru-campana__vacio">No pudimos cargar tus notificaciones.</p>
      } @else {
        <ul class="ru-campana__lista">
          @for (n of lista(); track n.id) {
            <li>
              <button
                type="button"
                class="ru-campana__item"
                [class.ru-campana__item--nueva]="!n.leida"
                (click)="abrirNotificacion(n)"
              >
                <span class="ru-campana__mensaje">{{ n.mensaje }}</span>
                <span class="ru-campana__fecha">{{ fecha(n.fechaCreacion) }}</span>
              </button>
            </li>
          } @empty {
            <li class="ru-campana__vacio">No tienes notificaciones.</li>
          }
        </ul>
      }
    </div>
  }
</div>
