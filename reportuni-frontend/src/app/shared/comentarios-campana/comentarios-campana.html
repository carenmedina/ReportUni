<div class="ru-campana">
  <button
    type="button"
    class="ru-campana__boton"
    (click)="alternar()"
    [attr.aria-expanded]="abierto()"
    aria-label="Comentarios"
    title="Comentarios"
  >
    <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
    @if (noLeidos() > 0) {
      <span class="ru-campana__contador">{{ noLeidos() > 9 ? '9+' : noLeidos() }}</span>
    }
  </button>

  @if (abierto()) {
    <div class="ru-campana__panel" role="dialog" aria-label="Comentarios">
      <div class="ru-campana__cabecera">
        <strong>Comentarios</strong>
        @if (noLeidos() > 0) {
          <button type="button" class="ru-campana__enlace" (click)="marcarTodos()">Marcar todos como leídos</button>
        }
      </div>

      @if (cargando()) {
        <p class="ru-campana__vacio">Cargando...</p>
      } @else if (error()) {
        <p class="ru-campana__vacio">No pudimos cargar los comentarios.</p>
      } @else {
        <ul class="ru-campana__lista">
          @for (n of lista(); track n.id) {
            <li>
              <button
                type="button"
                class="ru-campana__item"
                [class.ru-campana__item--nueva]="!n.leida"
                (click)="abrirComentario(n)"
              >
                <span class="ru-campana__mensaje">{{ n.mensaje }}</span>
                <span class="ru-campana__fecha">{{ fecha(n.fechaCreacion) }}</span>
              </button>
            </li>
          } @empty {
            <li class="ru-campana__vacio">Aún no hay comentarios en tus reportes.</li>
          }
        </ul>
      }
    </div>
  }
</div>
