<div class="ru-app">
  <header class="ru-header">
    <div class="ru-header__logo">
      <img class="ru-header__logo-img" src="logo-fet.png" alt="Fundación Escuela Tecnológica de Neiva" />
    </div>

    <nav class="ru-header__nav">
      <span class="ru-navlink ru-navlink--active">Reportes</span>
    </nav>

    <div class="ru-header__actions">
      <div class="ru-header__icon" title="Comentarios" aria-label="Comentarios">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>
      </div>

      <app-notificaciones-campana />

      <div class="ru-usermenu">
        <button
          type="button"
          class="ru-header__user"
          (click)="alternarMenuUsuario()"
          [attr.aria-expanded]="menuUsuarioAbierto()"
          aria-haspopup="menu"
        >
          <span class="ru-header__user-nombre">{{ usuario()?.nombreCompleto?.toUpperCase() ?? '' }}</span>
          <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        @if (menuUsuarioAbierto()) {
          <div class="ru-usermenu__panel" role="menu">
            <div class="ru-usermenu__info">
              <strong>{{ usuario()?.nombreCompleto }}</strong>
              <span>{{ etiquetaRol() }}</span>
            </div>
            <button type="button" class="ru-usermenu__item" role="menuitem" (click)="cerrarSesion()">
              Cerrar sesión
            </button>
          </div>
        }
      </div>
    </div>
  </header>

  <div class="ru-subnav">
    @for (item of itemsMenu(); track item.ruta) {
      <a class="ru-subnav__tab" [routerLink]="item.ruta" routerLinkActive="ru-subnav__tab--active">
        {{ item.etiqueta }}
      </a>
    }
    <span class="ru-subnav__spacer"></span>
    <span class="ru-subnav__hint">Módulo Reportes</span>
  </div>

  <main class="ru-content">
    <router-outlet></router-outlet>
  </main>

  <footer class="ru-footer">
    <span>© Sistema de Reportes Universitario V1.0</span>
    <span class="ru-footer__secondary">Fundación Escuela Tecnológica de Neiva</span>
  </footer>
</div>
